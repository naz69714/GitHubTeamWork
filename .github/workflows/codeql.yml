name: "CodeQL"

on:
  push:
    branches: [ "main", "master" ]  # сіздің default branch-ті қойыңыз
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 1'  # апта сайын дүйсенбі

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    
    # *** МІНДЕТТІ БӨЛІМ – permissions ***
    permissions:
      actions: read
      contents: read
      security-events: write  # CodeQL нәтижелерін жазу үшін қажет
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]  # немесе 'javascript'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
